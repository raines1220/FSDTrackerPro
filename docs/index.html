    body {
      margin: 0;

      height: 100vh;
    }

    header {
      padding: 1rem;
      background-color: #202020;
      color: #ffffff;
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Video section */
    .video-section {
      flex: 1;
      position: relative;
      background: #000;
    }
    .video-wrapper {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Side panel */
    .side-panel {
      width: 400px;
      background: #fff;
      border-left: 1px solid #ddd;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .filter-row {
      padding: 0.75rem;
      border-bottom: 1px solid #ddd;
      background-color: #f9f9f9;
    }
    .filter-row select {
      padding: 0.4rem;
      font-size: 0.9rem;
    }

    .events-list {
      flex: 1;
      overflow-y: auto;
    }

    .event-item {
      border-bottom: 1px solid #eee;
      padding: 0.75rem;
      cursor: pointer;
    }
    .event-item:hover {
      background-color: #f0f0f0;
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .event-header .timestamp {
      color: #007bff;
      cursor: pointer;
      margin-left: 1rem;
    }
    .event-type {
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
    .description {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    /* Scrollbar styling for side panel (optional) */
    .side-panel::-webkit-scrollbar {
      width: 8px;
    }
    .side-panel::-webkit-scrollbar-thumb {
      background-color: #ccc;
      border-radius: 4px;
    }
  </style>
</head>

(function() {
  const eventsListEl = document.getElementById('eventsList');
  const filterSelect = document.getElementById('filterType');
  const youtubePlayer = document.getElementById('player');
  const eventsData = data.results; // array of events

  // Convert "Positive: Something" to "Positive", etc.
  function getEventPolarity(eventType) {
    // typically "Positive: X" or "Negative: Y"
    if (!eventType) return 'Other';
    return eventType.startsWith('Positive')
      ? 'Positive'
      : eventType.startsWith('Negative')
      ? 'Negative'
      : 'Other';
  }

  // Renders the list of events into the side panel
  function renderEvents(filterVal = 'all') {
    eventsListEl.innerHTML = ''; // clear existing
    
    // Filter events based on filterVal
    const filtered = eventsData.filter(evt => {
      if (filterVal === 'all') return true;
      if (filterVal === 'disengaged') {
        // Return only events where the driver has "Intervened/Disengaged"
        return evt.driver_action === 'Intervened/Disengaged';
      }
      // For "Positive" or "Negative", use event polarity based on event_type
      return getEventPolarity(evt.event_type) === filterVal;
    });

    filtered.forEach((evt, index) => {
      // Create event item wrapper
      const item = document.createElement('div');
      item.className = 'event-item';

      // Create event header container
      const header = document.createElement('div');
      header.className = 'event-header';

      // Event type span
      const evtType = document.createElement('span');
      evtType.className = 'event-type';
      evtType.textContent = evt.event_type;

      // Timestamp span which also jumps to the video time on click
      const ts = document.createElement('span');
      ts.className = 'timestamp';
      ts.textContent = evt.timestamp;
      ts.addEventListener('click', (e) => {
        const timeParts = evt.timestamp.split(':').map(x => parseInt(x, 10));
        let seconds = 0;
        if (timeParts.length === 2) {
          seconds = timeParts[0] * 60 + timeParts[1];
        } else if (timeParts.length === 3) {
          seconds = timeParts[0] * 3600 + timeParts[1] * 60 + timeParts[2];
        }
        youtubePlayer.src = `https://www.youtube.com/embed/${video_id}?autoplay=1&start=${seconds}`;
      });

      // Append event type and timestamp to header
      header.appendChild(evtType);
      header.appendChild(ts);

      // Create a description element that is hidden by default
      const desc = document.createElement('div');
      desc.className = 'description hidden';
      desc.textContent = evt.description;

      // Toggle description when the item is clicked (ignoring clicks on the timestamp)
      item.addEventListener('click', (e) => {
        if (e.target.classList.contains('timestamp')) return;
        desc.classList.toggle('hidden');
      });

      // Build the event item element and append it to the list
      item.appendChild(header);
      item.appendChild(desc);
      eventsListEl.appendChild(item);
    });
  }

  // initial render
  renderEvents();

  // filter logic
  filterSelect.addEventListener('change', (e) => {
    renderEvents(e.target.value);
  });
})();
</script>
</body>
</html>
